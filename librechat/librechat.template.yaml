          rgb-surface-active-alt: '240 205 135'
          rgb-surface-nav-hover: '252 234 190'
          rgb-surface-nav-selected: '245 215 150'
          rgb-surface-card: '255 246 225'
          rgb-surface-card-hover: '252 234 190'
          rgb-surface-dialog: '255 251 240'
          rgb-surface-menu: '255 251 240'
          rgb-surface-popover: '255 251 240'
          rgb-text-primary: '58 36 18'
          rgb-border-medium: '230 205 160'
